# Reusable sandbox configuration. Paths using ${HOME} are expanded by msb.
image: "localhost:5050/agentbay:local"
cpus: 4
memory: "12G"
workdir: "${HOME}/dev"

env:
  MICROSANDBOX_PROJECT_ROOT: "${HOME}/dev"
  MICROSANDBOX_GIT_USER_NAME: "${MICROSANDBOX_GIT_USER_NAME}"
  MICROSANDBOX_GIT_USER_EMAIL: "${MICROSANDBOX_GIT_USER_EMAIL}"
  # Resolved from the host environment and stored in the VM config. No msb
  # secret is used: that would turn on TLS interception for all HTTPS traffic.
  METAMCP_AUTH_TOKEN: "${METAMCP_AUTH_TOKEN}"

mounts:
  - bind: "${HOME}/dev"
    target: "${HOME}/dev"
    uid: 1000
    gid: 1000
  - named: agentbay-claude-projects
    target: "/home/dev-ai-vm/.claude/projects"
    create: ensure-exists
    uid: 1000
    gid: 1000
  - named: agentbay-claude-image-cache
    target: "/home/dev-ai-vm/.claude/image-cache"
    create: ensure-exists
    uid: 1000
    gid: 1000
